<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f35"/>
      <stop offset="100%" style="stop-color:#0d1224"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f8ef7"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="200" fill="#4f8ef7" opacity="0.08"/>
  <circle cx="150" cy="520" r="180" fill="#a855f7" opacity="0.08"/>
  <!-- Accent bar -->
  <rect x="80" y="260" width="6" height="110" rx="3" fill="url(#accent)"/>
  <!-- Store name -->
  <text x="110" y="320" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="white">Bang Pray Store</text>
  <!-- Tagline -->
  <text x="110" y="375" font-family="Arial, sans-serif" font-size="32" fill="#94a3b8">Top Up Game Terpercaya · Proses Cepat · Harga Terjangkau</text>
  <!-- Game badges -->
  <rect x="110" y="420" width="220" height="48" rx="24" fill="#4f8ef7" opacity="0.2"/>
  <text x="220" y="451" font-family="Arial, sans-serif" font-size="22" fill="#4f8ef7" text-anchor="middle" font-weight="700">Mobile Legends</text>
  <rect x="350" y="420" width="180" height="48" rx="24" fill="#f97316" opacity="0.2"/>
  <text x="440" y="451" font-family="Arial, sans-serif" font-size="22" fill="#f97316" text-anchor="middle" font-weight="700">Free Fire</text>
  <rect x="550" y="420" width="140" height="48" rx="24" fill="#22c55e" opacity="0.2"/>
  <text x="620" y="451" font-family="Arial, sans-serif" font-size="22" fill="#22c55e" text-anchor="middle" font-weight="700">Roblox</text>
  <!-- Domain hint -->
  <text x="110" y="560" font-family="Arial, sans-serif" font-size="24" fill="#475569">bangpraystore.com</text>
</svg>
