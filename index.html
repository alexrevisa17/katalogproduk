<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var u = new URL(location.href);
          if (u.searchParams.has('airoShareToken')) {
            u.searchParams.delete('airoShareToken');
            history.replaceState(null, '', u.toString());
          }
        } catch (e) {}
      })();
    </script>
    <meta name="referrer" content="same-origin" />
    <link rel="icon" type="image/svg+xml" href="/api/brand-icon.svg?v=7" />

    <meta name="theme-color" content="#087bff" />

    <!--app-head-->
